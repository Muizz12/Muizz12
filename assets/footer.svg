<svg
  width="100%"
  viewBox="0 0 900 130"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>

    <pattern id="footerGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>

    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    }
  </style>

  <!-- Background Card -->
  <rect width="900" height="130" rx="16" fill="url(#footerBg)"/>
  <rect width="900" height="130" rx="16" fill="url(#footerGrid)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="898.5" height="128.5" rx="15.25" fill="none" stroke="url(#footerBorder)" stroke-width="1.5"/>

  <!-- Animated Bottom Wave Accent -->
  <path fill="url(#footerWave)">
    <animate
      attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      values="
        M0 105 Q 225 85, 450 110 T 900 100 L 900 130 L 0 130 Z;
        M0 110 Q 225 125, 450 95 T 900 115 L 900 130 L 0 130 Z;
        M0 95 Q 225 105, 450 115 T 900 105 L 900 130 L 0 130 Z;
        M0 105 Q 225 85, 450 110 T 900 100 L 900 130 L 0 130 Z
      "
    />
  </path>

  <!-- CTA Heading -->
  <text
    x="450"
    y="44"
    text-anchor="middle"
    class="font-sans"
    font-size="20"
    font-weight="800"
    letter-spacing="1.2"
    fill="url(#ctaGrad)"
    filter="url(#footerGlow)"
  >
    LET&apos;S BUILD SOMETHING EXTRAORDINARY
  </text>

  <!-- Subtitle -->
  <text
    x="450"
    y="70"
    text-anchor="middle"
    class="font-sans"
    font-size="13"
    font-weight="500"
    fill="#94A3B8"
  >
    Have an idea, MVP, or complex product challenge? I bring products from concept to production.
  </text>

  <!-- Contact line -->
  <g transform="translate(450, 95)">
    <text text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#E2E8F0">
      <tspan fill="#38BDF8">Portfolio:</tspan> themoiz.com
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#34D399">Email:</tspan> kmuizz319@gmail.com
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#F59E0B">Upwork:</tspan> 5.0 ★ Top Rated
    </text>
  </g>
</svg>